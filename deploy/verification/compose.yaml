x-hosted-environment: &hosted_environment
  DASHBOARD_BUILD_ID: hosted-verification
  DASHBOARD_RELEASE_VERSION: 0.1.0-verification
  DASHBOARD_DEPLOYMENT_MODE: hosted
  DASHBOARD_PUBLIC_ORIGIN: https://hosted-api:8443
  DASHBOARD_ALLOWED_HOSTS: '["hosted-api"]'
  DASHBOARD_ALLOWED_ORIGINS: '["https://hosted-api:8443"]'
  DASHBOARD_SESSION_COOKIE_SECURE: "true"
  DASHBOARD_DB_HOST: db
  DASHBOARD_DB_NAME: parserium_collector
  DASHBOARD_DB_USER: parserium_collector
  DASHBOARD_DB_PASSWORD_FILE: /run/secrets/db_password
  DASHBOARD_EXPECTED_MIGRATION: 0009_unified_activity_history
  DASHBOARD_STORAGE_BACKEND: s3
  DASHBOARD_STORAGE_ENDPOINT: https://minio:9000
  DASHBOARD_STORAGE_REGION: us-east-1
  DASHBOARD_STORAGE_BUCKET: parserium-verification-primary
  DASHBOARD_STORAGE_FORCE_PATH_STYLE: "true"
  DASHBOARD_STORAGE_ACCESS_KEY_FILE: /run/secrets/storage_access_key
  DASHBOARD_STORAGE_SECRET_KEY_FILE: /run/secrets/storage_secret_key
  DASHBOARD_STORAGE_CA_BUNDLE_FILE: /run/secrets/storage_ca_bundle
  DASHBOARD_SCRATCH_ROOT: /var/lib/parserium-collector-scratch
  DASHBOARD_STATIC_ROOT: /app/static
  DASHBOARD_OIDC_ISSUER: https://verification-oidc:9443
  DASHBOARD_OIDC_CLIENT_ID: parserium-verification
  DASHBOARD_OIDC_PROVIDER_LABEL: Google
  DASHBOARD_OIDC_REDIRECT_URI: https://hosted-api:8443/api/v1/auth/callback

services:
  minio:
    image: parserium-minio:verification
    build:
      context: ../..
      target: minio-verification
    user: "0:0"
    entrypoint: ["/usr/local/bin/minio-entrypoint"]
    secrets:
      - storage_access_key
      - storage_secret_key
      - source: minio_tls_certificate
        target: minio_tls_certificate
      - source: minio_tls_private_key
        target: minio_tls_private_key
    volumes:
      - minio-data:/data
    read_only: true
    tmpfs:
      - /tmp
      - /minio-certs:uid=10002,gid=10002,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH  # read host-owned 0600 secrets; setpriv drops it
      - DAC_OVERRIDE
      - SETGID
      - SETPCAP
      - SETUID
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - private

  storage-bootstrap:
    image: parserium-collector:dev
    user: "0:0"
    entrypoint: ["/usr/local/bin/parserium-entrypoint"]
    command: ["python", "/verification/verification_s3_bootstrap.py"]
    environment:
      TEST_S3_ENDPOINT: https://minio:9000
      TEST_S3_REGION: us-east-1
      TEST_S3_BUCKET: parserium-verification-primary
      TEST_S3_BACKUP_BUCKET: parserium-verification-backup
      TEST_S3_ACCESS_KEY_FILE: /run/secrets/storage_access_key
      TEST_S3_SECRET_KEY_FILE: /run/secrets/storage_secret_key
      TEST_S3_CA_BUNDLE_FILE: /run/secrets/storage_ca_bundle
    secrets:
      - storage_access_key
      - storage_secret_key
      - storage_ca_bundle
    depends_on:
      minio:
        condition: service_started
    volumes:
      - type: bind
        source: ../../tests/fixtures
        target: /verification
        read_only: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH  # read host-owned 0600 secrets; setpriv drops it
      - SETGID
      - SETPCAP
      - SETUID
    security_opt:
      - no-new-privileges:true
    networks:
      - private

  verification-oidc:
    image: parserium-collector:dev
    user: "0:0"
    command: ["python", "/verification/verification_oidc_provider.py"]
    environment:
      OIDC_ISSUER: https://verification-oidc:9443
      OIDC_CLIENT_ID: parserium-verification
      OIDC_REDIRECT_URI: https://hosted-api:8443/api/v1/auth/callback
    secrets:
      - oidc_client_secret
      - oidc_ca_bundle
      - source: verification_oidc_tls_certificate
        target: tls_certificate
      - source: verification_oidc_tls_private_key
        target: tls_private_key
      - source: oidc_signing_private_key
        target: oidc_signing_private_key
    volumes:
      - type: bind
        source: ../../tests/fixtures
        target: /verification
        read_only: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH  # read host-owned 0600 secrets; setpriv drops it
      - SETGID
      - SETPCAP
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import ssl,urllib.request; context=ssl.create_default_context(cafile='/tmp/parserium-secrets/oidc_ca_bundle'); urllib.request.urlopen('https://verification-oidc:9443/health', context=context, timeout=3).read()",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - edge

  hosted-api:
    image: parserium-collector:dev
    profiles: ["hosted"]
    user: "0:0"
    command:
      [
        "uvicorn",
        "parserium_collector.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8443",
        "--ssl-certfile",
        "/tmp/parserium-secrets/tls_certificate",
        "--ssl-keyfile",
        "/tmp/parserium-secrets/tls_private_key",
        "--no-access-log",
      ]
    environment:
      <<: *hosted_environment
      DASHBOARD_CREDENTIAL_ENCRYPTION_KEY_FILE: /run/secrets/firecrawl_credential_wrapping_key
      DASHBOARD_CREDENTIAL_ENCRYPTION_KEY_ID: verification-v1
      DASHBOARD_FIRECRAWL_REMOTE_ALLOWED_PORTS: '[9444]'
      DASHBOARD_FIRECRAWL_REMOTE_PRIVATE_ALLOWLIST: '["test-firecrawl:9444"]'
      SSL_CERT_FILE: /run/secrets/storage_ca_bundle
    secrets:
      - db_password
      - session_signing_secret
      - oidc_client_secret
      - oidc_ca_bundle
      - storage_access_key
      - storage_secret_key
      - storage_ca_bundle
      - firecrawl_credential_wrapping_key
      - discovery_fingerprint_secret
      - source: hosted_api_tls_certificate
        target: tls_certificate
      - source: hosted_api_tls_private_key
        target: tls_private_key
    depends_on:
      migrate:
        condition: service_completed_successfully
      hosted-worker:
        condition: service_started
      storage-bootstrap:
        condition: service_completed_successfully
      verification-oidc:
        condition: service_healthy
      test-firecrawl:
        condition: service_healthy
    volumes: !override []
    read_only: true
    tmpfs: !override
      - /tmp
      - /var/lib/parserium-collector-scratch:uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH  # read host-owned 0600 secrets; setpriv drops it
      - SETGID
      - SETPCAP
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import ssl,urllib.request; context=ssl.create_default_context(cafile='/tmp/parserium-secrets/oidc_ca_bundle'); urllib.request.urlopen('https://hosted-api:8443/api/v1/health/live', context=context, timeout=3).read()",
        ]
      interval: 3s
      timeout: 5s
      retries: 30
    networks:
      - edge
      - private

  hosted-worker:
    image: parserium-collector:dev
    profiles: ["hosted"]
    command: ["python", "-m", "parserium_collector.worker"]
    user: "0:0"
    entrypoint: ["/usr/local/bin/parserium-entrypoint"]
    environment:
      <<: *hosted_environment
      DASHBOARD_WORKER_ID: hosted-worker-1
      DASHBOARD_CREDENTIAL_ENCRYPTION_KEY_FILE: /run/secrets/firecrawl_credential_wrapping_key
      DASHBOARD_CREDENTIAL_ENCRYPTION_KEY_ID: verification-v1
      DASHBOARD_DOWNLOAD_PRIVATE_ALLOWLIST: '["test-origin:8090"]'
    secrets:
      - db_password
      - oidc_client_secret
      - oidc_ca_bundle
      - storage_access_key
      - storage_secret_key
      - storage_ca_bundle
      - firecrawl_credential_wrapping_key
      - discovery_fingerprint_secret
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-bootstrap:
        condition: service_completed_successfully
      test-origin:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/parserium-collector-scratch:uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH  # read host-owned 0600 secrets; setpriv drops it
      - SETGID
      - SETPCAP
      - SETUID
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - edge
      - private

  test-origin:
    image: parserium-collector:dev
    command: ["python", "/verification/verification_document_origin.py"]
    volumes:
      - type: bind
        source: ../../tests/fixtures
        target: /verification
        read_only: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3).read()",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - edge

  test-firecrawl:
    image: parserium-collector:dev
    user: "0:0"
    entrypoint: ["/usr/local/bin/parserium-entrypoint"]
    command: ["python", "/verification/verification_firecrawl_stub.py"]
    secrets:
      - firecrawl_test_bearer
      - storage_ca_bundle
      - source: test_firecrawl_tls_certificate
        target: tls_certificate
      - source: test_firecrawl_tls_private_key
        target: tls_private_key
    volumes:
      - type: bind
        source: ../../tests/fixtures
        target: /verification
        read_only: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH  # read host-owned 0600 secrets; setpriv drops it
      - SETGID
      - SETPCAP
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import ssl,urllib.request; context=ssl.create_default_context(cafile='/run/secrets/storage_ca_bundle'); urllib.request.urlopen('https://test-firecrawl:9444/health', context=context, timeout=3).read()",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - edge

  test-firecrawl-self-hosted:
    image: parserium-collector:dev
    command:
      ["python", "/verification/verification_firecrawl_stub.py", "--legacy-http"]
    volumes:
      - type: bind
        source: ../../tests/fixtures
        target: /verification
        read_only: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3).read()",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - edge

  worker:
    environment:
      DASHBOARD_DOWNLOAD_PRIVATE_ALLOWLIST: '["test-origin:8090"]'
    depends_on:
      test-origin:
        condition: service_healthy

  api:
    environment:
      DASHBOARD_FIRECRAWL_BASE_URL: http://test-firecrawl-self-hosted:8091
    depends_on:
      test-firecrawl-self-hosted:
        condition: service_healthy
    ports: !override
      - "127.0.0.1:${PARSERIUM_VERIFICATION_PORT:-18080}:8080"

secrets:
  oidc_client_secret:
    file: ../../.local/verification-pki/oidc-client-secret
  oidc_ca_bundle:
    file: ../../.local/verification-pki/ca.pem
  hosted_api_tls_certificate:
    file: ../../.local/verification-pki/hosted-api-cert.pem
  hosted_api_tls_private_key:
    file: ../../.local/verification-pki/hosted-api-key.pem
  verification_oidc_tls_certificate:
    file: ../../.local/verification-pki/verification-oidc-cert.pem
  verification_oidc_tls_private_key:
    file: ../../.local/verification-pki/verification-oidc-key.pem
  oidc_signing_private_key:
    file: ../../.local/verification-pki/oidc-signing-key.pem
  storage_access_key:
    file: ../../.local/verification-pki/minio-access-key
  storage_secret_key:
    file: ../../.local/verification-pki/minio-secret-key
  storage_ca_bundle:
    file: ../../.local/verification-pki/ca.pem
  minio_tls_certificate:
    file: ../../.local/verification-pki/minio-cert.pem
  minio_tls_private_key:
    file: ../../.local/verification-pki/minio-key.pem
  firecrawl_credential_wrapping_key:
    file: ../../.local/verification-pki/firecrawl-credential-wrapping-key
  discovery_fingerprint_secret:
    file: ../../.local/verification-pki/discovery-fingerprint-secret
  firecrawl_test_bearer:
    file: ../../.local/verification-pki/firecrawl-test-bearer
  test_firecrawl_tls_certificate:
    file: ../../.local/verification-pki/test-firecrawl-cert.pem
  test_firecrawl_tls_private_key:
    file: ../../.local/verification-pki/test-firecrawl-key.pem

volumes:
  minio-data:
