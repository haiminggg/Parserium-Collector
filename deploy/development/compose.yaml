name: parserium-collector-dev

services:
  db:
    image: docker.io/library/postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: parserium_collector
      POSTGRES_USER: parserium_collector
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - database:/var/lib/postgresql
    tmpfs:
      - /tmp
      - /run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parserium_collector -d parserium_collector"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - private
    security_opt:
      - no-new-privileges:true

  storage-init:
    image: parserium-collector:dev
    build:
      context: ../..
      target: runtime
    user: "0:0"
    entrypoint: ["/usr/local/bin/parserium-entrypoint"]
    command:
      [
        "sh",
        "-c",
        "install -d -o 10001 -g 10001 -m 0700 /var/lib/parserium-collector /var/lib/parserium-collector-scratch",
      ]
    environment:
      PARSERIUM_KEEP_ROOT: "1"
    volumes:
      - storage:/var/lib/parserium-collector
      - scratch:/var/lib/parserium-collector-scratch
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    networks:
      - private

  migrate:
    image: parserium-collector:dev
    build:
      context: ../..
      target: runtime
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    user: "0:0"
    entrypoint: ["/usr/local/bin/parserium-entrypoint"]
    environment: &dashboard_environment
      DASHBOARD_BUILD_ID: local-dev
      DASHBOARD_RELEASE_VERSION: 0.1.0-dev
      DASHBOARD_DEPLOYMENT_MODE: self_hosted
      DASHBOARD_EXPECTED_MIGRATION: 0009_unified_activity_history
      DASHBOARD_DB_HOST: db
      DASHBOARD_DB_NAME: parserium_collector
      DASHBOARD_DB_USER: parserium_collector
      DASHBOARD_DB_PASSWORD_FILE: /run/secrets/db_password
      DASHBOARD_STORAGE_BACKEND: filesystem
      DASHBOARD_STORAGE_ROOT: /var/lib/parserium-collector
      DASHBOARD_SCRATCH_ROOT: /var/lib/parserium-collector-scratch
      DASHBOARD_STATIC_ROOT: /app/static
      DASHBOARD_ALLOWED_HOSTS: '["127.0.0.1","localhost","api"]'
      DASHBOARD_ALLOWED_ORIGINS: '["http://127.0.0.1:8080","http://localhost:8080","http://api:8080"]'
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH  # read host-owned 0600 secrets; setpriv drops it
      - SETGID
      - SETPCAP
      - SETUID
    security_opt:
      - no-new-privileges:true
    networks:
      - private

  worker:
    image: parserium-collector:dev
    build:
      context: ../..
      target: runtime
    command: ["python", "-m", "parserium_collector.worker"]
    user: "0:0"
    entrypoint: ["/usr/local/bin/parserium-entrypoint"]
    env_file:
      - ../../.local/config.env
    environment:
      <<: *dashboard_environment
      DASHBOARD_WORKER_ID: worker-1
      DASHBOARD_FIRECRAWL_BASE_URL: http://host.docker.internal:3002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - db_password
      - discovery_fingerprint_secret
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - storage:/var/lib/parserium-collector
      - scratch:/var/lib/parserium-collector-scratch
      - type: bind
        source: ${PARSERIUM_EXPORT_ROOT:-../../.local/exports}
        target: /exports
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH  # read host-owned 0600 secrets; setpriv drops it
      - SETGID
      - SETPCAP
      - SETUID
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - private
      - edge

  api:
    image: parserium-collector:dev
    build:
      context: ../..
      target: runtime
    user: "0:0"
    entrypoint: ["/usr/local/bin/parserium-entrypoint"]
    command:
      [
        "uvicorn",
        "parserium_collector.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "--no-access-log",
      ]
    env_file:
      - ../../.local/config.env
    environment:
      <<: *dashboard_environment
      DASHBOARD_FIRECRAWL_BASE_URL: http://host.docker.internal:3002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - db_password
      - session_signing_secret
      - discovery_fingerprint_secret
    depends_on:
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_started
    volumes:
      - storage:/var/lib/parserium-collector
      - scratch:/var/lib/parserium-collector-scratch
      - type: bind
        source: ${PARSERIUM_EXPORT_ROOT:-../../.local/exports}
        target: /exports
        read_only: true
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH  # read host-owned 0600 secrets; setpriv drops it
      - SETGID
      - SETPCAP
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health/live', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - private
      - edge

secrets:
  db_password:
    file: ../../.local/secrets/db_password
  session_signing_secret:
    file: ../../.local/secrets/session_signing_secret
  discovery_fingerprint_secret:
    file: ../../.local/secrets/discovery_fingerprint_secret

volumes:
  database:
  storage:
  scratch:

networks:
  private:
    internal: true
  edge:
    driver: bridge
